# Model 5: probabilistic evidence accumulator (non-neural temporal model).
#
#   l_t = log(p_t / (1 - p_t))
#   E_t = forgetting_factor * E_{t-1} + reliability_t * l_t
#
# The reliability weight is a logistic function of interpretable quality
# signals (motion consistency, candidate persistence, blur, brightness,
# candidate size, model uncertainty). Its coefficients are fitted on the
# training split; the alarm/cancel thresholds are selected on the validation
# split only.

model:
  type: evidence

evidence:
  alarm_threshold: 8.0
  cancel_threshold: -4.0
  forgetting_factor: 0.95
  min_reliability: 0.05
  max_reliability: 1.0
  clip_logit: 12.0
  use_reliability_model: true

# Weight of one false alarm per hour relative to one unit of video recall
# when the thresholds are selected on the validation split.
false_alarm_penalty: 1.0
forgetting_factor: 0.95

training:
  use_out_of_fold: true
  out_of_fold_folds: 3
  spatial_epochs: 30
  spatial_batch_size: 64

policy:
  mode: fixed
  confidence_threshold: 0.70
  persistence_seconds: 0.0
  decision_window_seconds: 3.00
  refractory_seconds: 2.0
  hysteresis_ratio: 0.6

data:
  dataset: firesense
  feature_dir: data/processed/features
  manifest: data/manifests/firesense_videos.csv
  splits_file: data/manifests/splits.csv
  split: split01
  pre_onset_guard_frames: 0
  sequence_stride: 1
