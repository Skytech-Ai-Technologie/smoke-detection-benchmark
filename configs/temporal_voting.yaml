# Model 2: fixed temporal voting baselines.
#
# These rules have no trainable parameters. Only the confidence threshold and
# the persistence duration are selected, and they are selected on the
# validation split (never on the test split).

model:
  type: voting

voting:
  mode: mean
  window_seconds: 3.00
  confidence_threshold: 0.70
  persistence_seconds: 1.50

# The four alternative rules that every temporal model has to beat.
# `evaluate_video --voting-mode` overrides the mode at evaluation time.
voting_modes:
  - mean
  - median
  - majority
  - max
  - persistence

training:
  use_out_of_fold: true
  out_of_fold_folds: 3
  spatial_epochs: 30
  spatial_batch_size: 64

policy:
  mode: fixed
  confidence_threshold: 0.70
  persistence_seconds: 1.50
  decision_window_seconds: 3.00
  refractory_seconds: 2.0
  hysteresis_ratio: 0.6

data:
  dataset: firesense
  feature_dir: data/processed/features
  manifest: data/manifests/firesense_videos.csv
  splits_file: data/manifests/splits.csv
  split: split01
  pre_onset_guard_frames: 0
  sequence_stride: 1
