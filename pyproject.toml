[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-temporal-detection"
version = "0.1.0"
description = "Calibrated temporal smoke detection for edge deployment: a reproducible benchmark of Kalman-HSV-CNN, fixed temporal rules, and calibrated temporal models."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "smoke-temporal-detection contributors" }]
keywords = ["smoke-detection", "temporal-models", "calibration", "edge-ai", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. The authoritative environment is requirements.lock.txt,
# which is generated from the exact environment used for the reported runs.
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8",
  "torch>=2.1",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
viz = ["matplotlib>=3.7"]

[project.scripts]
smoke-download = "src.data.download:main"
smoke-inspect = "src.data.inspect:main"
smoke-manifest = "src.data.build_manifest:main"
smoke-split = "src.data.video_split:main"

[tool.setuptools]
packages = ["src", "src.data", "src.models", "src.training", "src.evaluation", "src.visualization", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "dataset: requires locally downloaded datasets",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
